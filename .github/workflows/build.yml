name: Maydan Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: maydan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        env:
          CI: true
        run: npm run build

      - name: Upload build output when present
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maydan-build-output
          path: |
            .output/
            dist/
          if-no-files-found: warn
          retention-days: 7
