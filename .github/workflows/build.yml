name: Maydan Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maydan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test web and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check web source
        run: npm run typecheck

      - name: Build web production output
        run: npm run build

      - name: Verify and package web deployment output
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .vercel/output/config.json ]; then
            echo "ERROR: .vercel/output/config.json was not generated by the production build."
            exit 1
          fi
          test -d .vercel/output/functions
          test -d .vercel/output/static
          (cd .vercel/output && zip -qr "$GITHUB_WORKSPACE/Maydan-Vercel-Deployment.zip" .)

      - name: Build Android WebView app assets
        run: npm run build:android

      - name: Verify Android web assets
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/www/index.html
          test -d android/app/src/main/assets/www/assets
          echo "Android web assets created:"
          find android/app/src/main/assets/www -maxdepth 2 -type f | wc -l

      - name: Build installable Android APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: maydan-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload web deployment output
        uses: actions/upload-artifact@v4
        with:
          name: maydan-web-deployment
          path: Maydan-Vercel-Deployment.zip
          if-no-files-found: error
          retention-days: 14
